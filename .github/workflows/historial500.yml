name: Historial diario
# Cadena y niveles al cierre de una lista fija de tickers (historial500.py) en R2: hist500/{SYM}/{fecha}.json.gz
# Lo lanza el Worker a las 16:30 ET los dias laborables; el cron de GitHub es solo un respaldo
# (22:30 ET en invierno, 23:30 en verano). Si la sesion ya esta guardada, rehace la Validacion si se calculo
# antes de que CBOE publicara la vela diaria (historial500.validacion_pendiente).
on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Rehacer la ultima sesion cerrada aunque ya este guardada"
        type: boolean
        default: false
      indice:
        description: "Solo reconstruir los indices de niveles (hist500/_niveles/) con los dias ya guardados"
        type: boolean
        default: false
      validacion:
        description: "Solo recalcular la Validacion de toda la lista (pub/validacion500/)"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * 2-6"
concurrency:
  group: historial500
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  historial:
    runs-on: ubuntu-latest
    # con Tradier la cadena se pide por vencimiento (unas 20 peticiones por ticker): mas lenta que el JSON de CBOE
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nube.txt
      - run: pip install -q -r requirements-nube.txt
      - name: Guardar la sesion
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'gexlab' }}
          GEX_ALMACEN: r2
          # cadenas de Tradier: la API de CBOE (delayed_quotes) da 403 desde el 2026-11-20
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          FORZAR: ${{ inputs.forzar && '--forzar' || '' }}
          INDICE: ${{ inputs.indice && '--indice' || '' }}
          VALIDACION: ${{ inputs.validacion && '--validacion' || '' }}
        run: python historial500.py $FORZAR $INDICE $VALIDACION
