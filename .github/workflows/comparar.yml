name: Comparar con gexbot
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de pruebas/ a ejecutar"
        default: "comparar_vencimientos.py"
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python pruebas/${{ inputs.script }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
