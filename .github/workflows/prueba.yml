name: Prueba CBOE
on:
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar datos de CBOE, CFE y CFTC
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, gzip
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          T = [
           ("Cadena SPX", "https://cdn.cboe.com/api/global/delayed_quotes/options/_SPX.json"),
           ("Cadena SPX (cdn-api)", "https://cdn-api.cboe.com/api/global/delayed_quotes/options/_SPX.json"),
           ("Cadena NDX", "https://cdn.cboe.com/api/global/delayed_quotes/options/_NDX.json"),
           ("Cadena RUT", "https://cdn.cboe.com/api/global/delayed_quotes/options/_RUT.json"),
           ("Cadena VIX", "https://cdn.cboe.com/api/global/delayed_quotes/options/_VIX.json"),
           ("Cadena SPY", "https://cdn.cboe.com/api/global/delayed_quotes/options/SPY.json"),
           ("Cadena TSLA", "https://cdn.cboe.com/api/global/delayed_quotes/options/TSLA.json"),
           ("Cotizacion SPX", "https://cdn.cboe.com/api/global/delayed_quotes/quotes/_SPX.json"),
           ("Cotizacion IRX", "https://cdn.cboe.com/api/global/delayed_quotes/quotes/_IRX.json"),
           ("Historico VIX", "https://cdn.cboe.com/api/global/delayed_quotes/charts/historical/_VIX.json"),
           ("Intradia SPX", "https://cdn.cboe.com/api/global/delayed_quotes/charts/intraday/_SPX.json"),
           ("Curva VX (nov)", "https://cdn.cboe.com/data/us/futures/market_statistics/historical_data/VX/VX_2026-11-18.csv"),
           ("COT CFTC", "https://publicreporting.cftc.gov/resource/gpe5-46if.json?$limit=5"),
           ("Directorio simbolos", "https://www.cboe.com/us/options/symboldir/equity_index_options/?download=csv"),
          ]
          ok = 0
          for name, url in T:
              t = time.time()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*", "Accept-Encoding": "gzip"})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      raw = r.read(); code = r.status
                      if r.headers.get("Content-Encoding") == "gzip": raw = gzip.decompress(raw)
                  extra = ""
                  if "delayed_quotes/options/" in url:
                      d = json.loads(raw); extra = f"{len(d['data']['options'])} contratos, hora {d.get('timestamp','?')}"
                  elif url.endswith(".json") and "historical" in url:
                      extra = f"{len(json.loads(raw)['data'])} dias"
                  print(f"OK    {name:<22} HTTP {code}  {len(raw)/1e6:6.2f} MB  {time.time()-t:5.1f}s  {extra}")
                  ok += 1
              except Exception as e:
                  print(f"FALLO {name:<22} {type(e).__name__}: {str(e)[:80]}  {time.time()-t:5.1f}s")
              time.sleep(0.4)
          print(f"\nResultado: {ok}/{len(T)} correctos")
          PY
