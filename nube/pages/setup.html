<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef1f4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>GEX Lab - Admin setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="light"] { --ink: #eef1f4; --surface: #ffffff; --line: #d9dee5; --line-strong: #bfc7d1; --text: #17202c; --muted: #465061;
    --faint: #677283; --call: #c0302e; --focus: #2451a6; --btn: #17202c; --btn-hover: #2b3545; --btn-text: #ffffff; color-scheme: light; }
  :root[data-theme="dark"] { --ink: #10151d; --surface: #161c26; --line: #29313e; --line-strong: #3a4352; --text: #e9edf3; --muted: #a9b2c0; --faint: #7a8597;
    --call: #ff6b6b; --focus: #8eaefc; --btn: #e9edf3; --btn-hover: #cfd6e0; --btn-text: #10151d; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink); color: var(--text); font: 15px/1.45 "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 30px 28px 26px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 22px; margin-bottom: 6px; }
  .sub { color: var(--faint); font-size: 13px; margin: 0 0 24px; }
  label { display: block; color: var(--muted); font-size: 12.5px; margin: 0 0 6px 2px; }
  input {
    width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; color: var(--text);
    font: inherit; padding: 11px 13px; margin-bottom: 16px; outline: none;
  }
  input:focus { border-color: var(--line-strong); }
  button {
    width: 100%; margin-top: 4px; border: 0; border-radius: 10px; padding: 11px 14px; font: inherit; font-weight: 500;
    background: var(--btn); color: var(--btn-text); font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .err { min-height: 20px; color: var(--call); font-size: 13px; margin: 12px 2px 0; }
  .foot { color: var(--faint); font-size: 12px; text-align: center; margin-top: 18px; }
  .hint { color: var(--faint); font-size: 12px; margin: -8px 2px 16px; }
</style>
<script>try{if(localStorage.getItem("gexlab.theme")==="dark"){document.documentElement.dataset.theme="dark";document.querySelector('meta[name="theme-color"]').content="#10151d"}}catch(e){}</script>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="2" y="11" width="3" height="8" rx="1" fill="#d9775f"/><rect x="7" y="11" width="3" height="5" rx="1" fill="#d9775f"/>
      <rect x="12" y="6" width="3" height="5" rx="1" fill="#4b8fd6"/><rect x="17" y="3" width="3" height="8" rx="1" fill="#4b8fd6"/>
      <line x1="1" y1="11" x2="21" y2="11" stroke="#8a93a3" stroke-width="1"/>
    </svg>
    GEX Lab
  </div>
  <p class="sub">Administrator setup. This is done only once.</p>
  <form id="f" autocomplete="off">
    <label for="code">Setup code</label>
    <input id="code" type="password" autocomplete="off" required>
    <p class="hint">The one you saved in GitHub as GEX_SETUP_CODE.</p>
    <label for="user">Username</label>
    <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="pw">Password (at least 10 characters)</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="10" required>
    <label for="pw2">Repeat it</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="10" required>
    <button id="go" type="submit">Create administrator</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
  "use strict";
  async function derive(pw, salHex, iter) {
    const sal = new Uint8Array(salHex.match(/../g).map((h) => parseInt(h, 16)));
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: sal, iterations: iter }, key, 256);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const randSal = () => [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join("");
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    const pw = document.getElementById("pw").value;
    if (pw.length < 10) { err.textContent = "The password must be at least 10 characters long."; return; }
    if (pw !== document.getElementById("pw2").value) { err.textContent = "The passwords don't match."; return; }
    go.disabled = true; go.textContent = "Creating…";
    try {
      const usuario = document.getElementById("user").value.trim().toLowerCase();
      const sal = randSal();
      const clave = await derive(pw, sal, 310000);
      const r = await fetch("/api/setup", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ codigo: document.getElementById("code").value, usuario, sal, clave }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Could not create the account");
      location.replace("/");
    } catch (x) {
      err.textContent = x.message;
      go.disabled = false; go.textContent = "Create administrator";
    }
  });
  document.getElementById("code").focus();
</script>
</body>
</html>
