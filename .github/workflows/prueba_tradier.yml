name: Prueba Tradier
on:
  workflow_dispatch:
jobs:
  tradier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pruebas/tradier.py
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
