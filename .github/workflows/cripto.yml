name: Crypto
# Seccion Crypto (cripto.py): derivados de Deribit y OKX, on-chain y lectura de BTC y ETH en R2 pub/cripto.json.
# La lanza el cron del Worker cada 15 min, 24/7 (tocaCripto). Sin claves: todas las fuentes son publicas.
on:
  workflow_dispatch:
concurrency:
  group: cripto
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cripto:
    runs-on: ubuntu-latest
    # la primera pasada descarga el funding de Deribit desde 2019 (unas 180 peticiones); despues, menos de 2 min
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nube.txt
      - run: pip install -q -r requirements-nube.txt
      - run: python pruebas/test_cripto.py
      - name: Calcular y publicar
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'gexlab' }}
          GEX_ALMACEN: r2
          # lista de activos del mapa de liquidaciones (future-markets de Coinalyze)
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python cripto.py
