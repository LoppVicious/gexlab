name: Prueba Equity Hub
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy certifi
      - shell: python
        run: |
          import sys, os; sys.path.insert(0, os.getcwd())
          import numpy as np, gex_engine as g
          for sym, dte, w in (("TSLA", 7, 8.0), ("TSLA", 45, 8.0), ("SPX", 45, 5.0), ("SPX", 0, "auto"), ("NVDA", None, 8.0)):
              r = g.compute(sym, max_dte=dte, window_pct=w)
              p, h = r["profile"], r["hub"]
              lo, hi = r["spot"] * (1 - r["meta"]["window_pct"] / 100), r["spot"] * (1 + r["meta"]["window_pct"] / 100)
              x = np.array(p["x"]); m = (x >= lo) & (x <= hi)
              print(f"{sym} dte={dte} rango=±{r['meta']['window_pct']:.2f}% spot={r['spot']:.2f} [{lo:.1f}, {hi:.1f}] front={r['front_expiry']} semanal={p['week_exp']}")
              print(f"   perfil en spot {np.interp(r['spot'], p['x'], p['y'])/1e6:.1f}M = GEX neta {r['totals']['net_per_dollar']/1e6:.1f}M | max {np.max(np.array(p['y'])[m])/1e6:.1f}M en {x[m][np.argmax(np.array(p['y'])[m])]:.1f}, min {np.min(np.array(p['y'])[m])/1e6:.1f}M en {x[m][np.argmin(np.array(p['y'])[m])]:.1f}")
              print(f"   baja vol {h['low_vol_point']}  alta vol {h['high_vol_point']}  call wall {r['levels']['call_wall']}  put wall {r['levels']['put_wall']}  flip {r['levels']['flip']}")
              print(f"   OI c/p {h['call_oi']:.0f}/{h['put_oi']:.0f} ratio {h['pc_oi']:.2f}  vol c/p {h['call_vol']:.0f}/{h['put_vol']:.0f}  top gamma {h['top_gamma_exp']} top delta {h['top_delta_exp']}  iv30 {h['iv30']} rv20 {h['rv20']}")
