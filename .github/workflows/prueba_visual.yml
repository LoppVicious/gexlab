name: Prueba visual
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: |
          python server.py --server > server.log 2>&1 &
          sleep 5
          python pruebas/visual.py || true
      - name: Resultados en la rama temporal prueba-visual
        run: |
          cd salida_visual
          git init -q -b prueba-visual
          git config user.name "gexlab"; git config user.email "gexlab@users.noreply.github.com"
          git add -A && git commit -qm "capturas"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" prueba-visual
